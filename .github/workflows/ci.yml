name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mnemos
          POSTGRES_PASSWORD: mnemos
          POSTGRES_DB: mnemos_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mnemos -d mnemos_test"
          --health-interval 3s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts/mnemos

      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: pnpm

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"

      - name: Install dependencies
        run: make install

      # The same command a reviewer runs locally: static checks and unit tests
      # for the contract, the crypto packages, the broker, the MCP server and
      # the web app.
      - name: make check
        run: ./scripts/check.sh

      - name: Broker integration tests
        working-directory: apps/broker
        env:
          DATABASE_URL: postgresql+asyncpg://mnemos:mnemos@localhost:5432/mnemos_test
        run: |
          uv run alembic upgrade head
          uv run pytest -q -m integration

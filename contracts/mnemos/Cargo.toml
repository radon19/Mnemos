[package]
name = "mnemos-contract"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"
description = "Mnemos: user-owned AI memory with metered, revocable access on NEAR"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.30.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

[dev-dependencies]
near-sdk = { version = "=5.30.1", features = ["unit-testing"] }
near-workspaces = { version = "=0.24.0", features = ["unstable"] }
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
anyhow = "1.0.100"
serde_json = "1.0.145"

[profile.release]
codegen-units = 1
opt-level = "s"
lto = true
debug = false
panic = "abort"
overflow-checks = true

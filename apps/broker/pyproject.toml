[project]
name = "mnemos-broker"
version = "0.1.0"
description = "Mnemos broker: scoped, metered memory access with NEAR AI TEE inference"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "fastapi==0.162.4",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.14.3",
  "pydantic-settings==2.16.2",
  "sqlalchemy[asyncio]==2.1.8",
  "asyncpg==0.32.0",
  "alembic==1.20.1",
  "cryptography==50.0.2",
  "httpx==0.28.1",
  "structlog==26.1.0",
  "nearai-inference-sdk==0.3.0",
  "base58==2.1.1",
]

[project.scripts]
mnemos-broker = "mnemos_broker.cli:main"

[dependency-groups]
dev = [
  "pytest==9.2.0",
  "pytest-asyncio==1.4.1.post1",
  "respx==0.23.1",
  "ruff==0.17.4",
  "mypy==2.4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mnemos_broker"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S", "RUF"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_untyped_decorators = false
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-m 'not integration and not live'"
markers = [
  "integration: needs a real Postgres and runs integration tests",
  "live: calls NEAR AI Cloud and is not run in CI",
]

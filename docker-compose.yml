name: mnemos

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mnemos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mnemos}
      POSTGRES_DB: ${POSTGRES_DB:-mnemos}
    ports:
      - "5432:5432"
    volumes:
      - mnemos-pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/10-mnemos-test.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mnemos} -d ${POSTGRES_DB:-mnemos}"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  broker:
    build:
      context: ./apps/broker
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mnemos}:${POSTGRES_PASSWORD:-mnemos}@postgres:5432/${POSTGRES_DB:-mnemos}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_BROKER_URL: ${NEXT_PUBLIC_BROKER_URL:-http://localhost:8000}
        NEXT_PUBLIC_CONTRACT_ID: ${NEXT_PUBLIC_CONTRACT_ID:-}
        NEXT_PUBLIC_NEAR_NETWORK: ${NEXT_PUBLIC_NEAR_NETWORK:-testnet}
        NEXT_PUBLIC_NEAR_RPC_URL: ${NEXT_PUBLIC_NEAR_RPC_URL:-https://test.rpc.fastnear.com}
        NEXT_PUBLIC_BROKER_RECIPIENT: ${NEXT_PUBLIC_BROKER_RECIPIENT:-localhost:8000}
        NEXT_PUBLIC_DEMO_MODE: ${NEXT_PUBLIC_DEMO_MODE:-false}
    environment:
      NEXT_PUBLIC_BROKER_URL: ${NEXT_PUBLIC_BROKER_URL:-http://localhost:8000}
      NEXT_PUBLIC_CONTRACT_ID: ${NEXT_PUBLIC_CONTRACT_ID:-}
      NEXT_PUBLIC_NEAR_NETWORK: ${NEXT_PUBLIC_NEAR_NETWORK:-testnet}
      NEXT_PUBLIC_NEAR_RPC_URL: ${NEXT_PUBLIC_NEAR_RPC_URL:-https://test.rpc.fastnear.com}
      NEXT_PUBLIC_BROKER_RECIPIENT: ${NEXT_PUBLIC_BROKER_RECIPIENT:-localhost:8000}
      NEXT_PUBLIC_DEMO_MODE: ${NEXT_PUBLIC_DEMO_MODE:-false}
      DEMO_OWNER_SECRET_KEY: ${DEMO_OWNER_SECRET_KEY:-}
      MNEMOS_OWNER_ACCOUNT: ${MNEMOS_OWNER_ACCOUNT:-}
      NEAR_RPC_URL: ${NEAR_RPC_URL:-https://test.rpc.fastnear.com}
    ports:
      - "3000:3000"
    depends_on:
      broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    restart: unless-stopped

volumes:
  mnemos-pgdata:
